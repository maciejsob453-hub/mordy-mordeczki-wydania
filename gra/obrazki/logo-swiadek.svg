<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Świadek Koronny: oko, które widziało wszystko, wpisane w pieczęć.
       Prestiżowy cel globalny — logo ma być surowe i bez fajerwerków. -->
  <defs>
    <linearGradient id="zloto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c264"/>
      <stop offset="0.55" stop-color="#d9ab45"/>
      <stop offset="1" stop-color="#9c7524"/>
    </linearGradient>
    <radialGradient id="zrenica" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2b3a2e"/>
      <stop offset="1" stop-color="#0b120c"/>
    </radialGradient>
  </defs>

  <circle cx="128" cy="128" r="118" fill="#0e1610" stroke="url(#zloto)" stroke-width="5"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="url(#zloto)" stroke-width="1.6" stroke-opacity="0.5"/>

  <!-- promienie pieczęci -->
  <g stroke="url(#zloto)" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.75">
    <line x1="128" y1="18" x2="128" y2="34"/>
    <line x1="128" y1="222" x2="128" y2="238"/>
    <line x1="18" y1="128" x2="34" y2="128"/>
    <line x1="222" y1="128" x2="238" y2="128"/>
    <line x1="50" y1="50" x2="61" y2="61"/>
    <line x1="195" y1="195" x2="206" y2="206"/>
    <line x1="206" y1="50" x2="195" y2="61"/>
    <line x1="61" y1="195" x2="50" y2="206"/>
  </g>

  <!-- oko -->
  <path d="M44 128 Q128 62 212 128 Q128 194 44 128 Z"
        fill="#141d16" stroke="url(#zloto)" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="128" cy="128" r="40" fill="url(#zrenica)" stroke="url(#zloto)" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="17" fill="#0b120c"/>
  <circle cx="116" cy="115" r="7" fill="#f0c264" fill-opacity="0.85"/>

  <!-- rysa przez oko: świadek, który zapłacił za to, co widział -->
  <path d="M92 92 L170 172" stroke="#0e1610" stroke-width="9" stroke-linecap="round"/>
  <path d="M92 92 L170 172" stroke="url(#zloto)" stroke-width="3.4" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- wstęga -->
  <path d="M62 196 L128 214 L194 196 L194 210 L128 230 L62 210 Z"
        fill="#141d16" stroke="url(#zloto)" stroke-width="3"/>
</svg>
