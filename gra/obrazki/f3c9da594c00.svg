<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Ręka Mordeczki: dłoń królewska podająca ludzi ze dworu.
       Cała sylwetka mieści się w pierścieniu, żeby nic nie było ucięte krawędzią. -->
  <circle cx="80" cy="80" r="78" fill="#12100a"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="#d9ab45" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="#8f7527" stroke-width="1.2"/>

  <!-- korona: węższa niż dłoń, żeby sylwetka czytała się jako jedna całość -->
  <g fill="#d9ab45">
    <path d="M66.5 46 L69.5 33 L75 39.5 L80 29.5 L85 39.5 L90.5 33 L93.5 46 Z"/>
    <rect x="65.5" y="46.4" width="29" height="4.6" rx="2.1"/>
    <circle cx="69.5" cy="31.8" r="2"/><circle cx="80" cy="28.2" r="2.2"/><circle cx="90.5" cy="31.8" r="2"/>
  </g>

  <!-- dłoń: cztery palce, kciuk i śródręcze zakończone mankietem.
       Zmniejszona względem pierścienia, żeby przy 26 px nie zlewała się z ramką. -->
  <g fill="#e8c765" transform="translate(80 92) scale(.9) translate(-80 -92)">
    <!-- kciuk: krótszy, grubszy i osadzony w śródręczu, a nie doklejony obok.
         Wcześniej odchodził w bok jak cienki patyk i wyglądał na złamany. -->
    <rect x="49" y="93" width="11.5" height="24" rx="5.75" transform="rotate(50 64 99)"/>
    <rect x="61" y="66" width="9.5" height="28" rx="4.75"/>
    <rect x="71.5" y="60" width="9.5" height="34" rx="4.75"/>
    <rect x="82" y="64" width="9.5" height="30" rx="4.75"/>
    <rect x="92.5" y="71" width="8.8" height="23" rx="4.4"/>
    <path d="M61 88 h40.3 v13 a20.15 20.15 0 0 1 -20.15 20.15 A20.15 20.15 0 0 1 61 101 Z"/>
    <rect x="59" y="118" width="44" height="7.5" rx="3.4" fill="#d9ab45"/>
  </g>
</svg>
